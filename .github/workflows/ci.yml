name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ─── Security ───────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Python ─────────────────────────────────────────────────
  python:
    name: Python Checks
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install freezegun

      - name: Syntax check all Python scripts
        run: |
          python3 -m py_compile t212_fetch.py
          python3 -m py_compile investbrain_import.py
          python3 -m py_compile preprocess_isin.py
          echo "All Python scripts compile successfully"

      - name: Run Python unit tests
        run: |
          python3 -m unittest tests/test_t212_fetch.py -v
          python3 -m unittest tests/test_investbrain_import.py -v

  # ─── Bash ───────────────────────────────────────────────────
  bash:
    name: Bash Checks
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Bash syntax check
        run: bash -n run-all.sh

      - name: Run BATS integration tests
        run: bats tests/test_run_all.bats

  # ─── ShellCheck ─────────────────────────────────────────────
  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint run-all.sh
        run: shellcheck run-all.sh

  # ─── Docker Build ───────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [security, python, bash]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t t212-sync-buddy:test .

      - name: Verify image has required scripts
        run: |
          docker run --rm t212-sync-buddy:test ls /app/run-all.sh
          docker run --rm t212-sync-buddy:test ls /app/t212_fetch.py
          docker run --rm t212-sync-buddy:test ls /app/investbrain_import.py
          echo "All required scripts present in image"

  # ─── File Integrity ─────────────────────────────────────────
  integrity:
    name: File Integrity
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify required files exist
        run: |
          required_files=(
            "t212_fetch.py"
            "run-all.sh"
            "investbrain_import.py"
            "preprocess_isin.py"
            "Dockerfile"
            "docker-compose.yml"
            "requirements.txt"
            ".env.sample"
            "README.md"
            "tests/test_t212_fetch.py"
            "tests/test_investbrain_import.py"
            "tests/test_run_all.bats"
          )
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Check .env is not committed
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env file should not be in repo"
            exit 1
          fi
          echo ".env not in repo (good)"

      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path "./.git/*" -not -path "./.state/*" | while read f; do
            echo "WARNING: Large file: $f ($(du -h "$f" | cut -f1))"
          done || echo "No large files found"
