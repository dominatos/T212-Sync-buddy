<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">T212-Sync-buddy</title>
  <desc id="desc">Automated Trading 212 to Ghostfolio/Investbrain Sync</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f81f7" />
      <stop offset="100%" stop-color="#a371f7" />
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Background decorative lines (motif) -->
  <path d="M 0 180 L 1200 180" stroke="#30363d" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />
  <path d="M 600 0 L 600 360" stroke="#30363d" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />

  <g id="title-block" transform="translate(80 80)">
    <rect x="0" y="-24" width="80" height="24" rx="4" fill="#2f81f7" opacity="0.2"/>
    <text x="12" y="-6" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="600">PIPELINE</text>
    
    <text x="0" y="40" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">T212-Sync-buddy</text>
    <text x="0" y="100" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Automated synchronization from</text>
    <text x="0" y="136" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400">Trading 212 to Ghostfolio &amp; Investbrain.</text>
    
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="220" height="40" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
      <text x="16" y="24" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">&gt; docker compose run</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(700 60)">
    <!-- T212 Node -->
    <rect x="0" y="20" width="160" height="80" rx="12" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <text x="80" y="58" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Trading 212</text>
    <text x="80" y="80" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">API Source</text>
    
    <!-- Arrow -->
    <path d="M 160 60 L 220 60" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="220" cy="60" r="4" fill="#58a6ff"/>
    
    <!-- Sync-buddy Core Node -->
    <rect x="150" y="140" width="180" height="100" rx="16" fill="#161b22" stroke="url(#accentGrad)" stroke-width="3"/>
    <text x="240" y="180" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Sync Buddy</text>
    <rect x="180" y="200" width="120" height="20" rx="10" fill="#238636" opacity="0.2"/>
    <text x="240" y="214" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">Normalization</text>
    
    <!-- Arrow up -->
    <path d="M 330 160 L 380 100" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="380" cy="100" r="4" fill="#58a6ff"/>

    <!-- Arrow down -->
    <path d="M 330 220 L 380 280" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="380" cy="280" r="4" fill="#58a6ff"/>
    
    <!-- Ghostfolio Node -->
    <rect x="360" y="20" width="140" height="80" rx="12" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <text x="430" y="58" fill="#e3b341" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Ghostfolio</text>
    <text x="430" y="80" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">JSON Import</text>

    <!-- Investbrain Node -->
    <rect x="360" y="240" width="140" height="80" rx="12" fill="#21262d" stroke="#30363d" stroke-width="2"/>
    <text x="430" y="278" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Investbrain</text>
    <text x="430" y="300" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">Direct Import</text>
  </g>
</svg>
