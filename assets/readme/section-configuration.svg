<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title desc">
  <title id="title">Configuration</title>
  <desc id="desc">Section header: Configure Credentials</desc>

  <rect width="1200" height="120" fill="transparent" />
  
  <path d="M 0 60 L 1200 60" stroke="#30363d" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />

  <g transform="translate(40, 60)">
    <circle cx="20" cy="0" r="16" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
    <!-- Lock icon abstraction -->
    <path d="M 14 -2 C 14 -6, 26 -6, 26 -2 L 26 2 L 14 2 Z" stroke="#a371f7" stroke-width="2" fill="none"/>
    <rect x="12" y="2" width="16" height="10" rx="2" fill="#a371f7"/>
    
    <text x="60" y="8" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700">Configuration</text>
    <text x="310" y="8" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="400">— Set your Credentials</text>
  </g>
</svg>
