<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="120" viewBox="0 0 1200 120"
     role="img" aria-labelledby="title desc">
  <title id="title">Monitoring</title>
  <desc id="desc">Section header: Monitoring and Maintenance</desc>

  <rect width="1200" height="120" fill="transparent" />
  
  <path d="M 0 60 L 1200 60" stroke="#30363d" stroke-width="1" stroke-dasharray="4 8" opacity="0.5" />

  <g transform="translate(40, 60)">
    <circle cx="20" cy="0" r="16" fill="#21262d" stroke="#e3b341" stroke-width="2"/>
    <!-- Eye/Monitoring icon abstraction -->
    <path d="M 12 0 Q 20 -8, 28 0 Q 20 8, 12 0 Z" stroke="#e3b341" stroke-width="2" fill="none"/>
    <circle cx="20" cy="0" r="3" fill="#e3b341"/>
    
    <text x="60" y="8" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="36" font-weight="700">Monitoring</text>
    <text x="260" y="8" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="400">— Logs and Maintenance</text>
  </g>
</svg>
