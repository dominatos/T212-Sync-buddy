<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">T212-Sync-buddy Workflow</title>
  <desc id="desc">Data flow from Trading 212 API to Ghostfolio and Investbrain</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="fetchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#2f81f7" />
    </linearGradient>
    <linearGradient id="runGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a371f7" />
      <stop offset="100%" stop-color="#d2a8ff" />
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- T212 Source -->
  <g id="t212-source" transform="translate(60, 160)">
    <circle cx="50" cy="50" r="40" fill="#21262d" stroke="#58a6ff" stroke-width="2" />
    <path d="M 35 40 L 65 40 M 40 50 L 60 50 M 45 60 L 55 60" stroke="#58a6ff" stroke-width="2" stroke-linecap="round"/>
    <text x="50" y="110" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600" text-anchor="middle">Trading 212</text>
    <text x="50" y="128" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">API</text>
  </g>

  <!-- Arrow -->
  <path d="M 160 210 L 220 210" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="220" cy="210" r="4" fill="#58a6ff"/>

  <!-- Fetcher Module -->
  <g id="fetcher" transform="translate(230, 140)">
    <rect x="0" y="0" width="200" height="140" rx="12" fill="#161b22" stroke="url(#fetchGrad)" stroke-width="2"/>
    <rect x="20" y="20" width="40" height="40" rx="8" fill="#2f81f7" opacity="0.1"/>
    <text x="40" y="45" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="bold" text-anchor="middle">py</text>
    
    <text x="80" y="38" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600">t212_fetch.py</text>
    <text x="80" y="56" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12">Fetcher Engine</text>

    <!-- Sub tasks -->
    <rect x="20" y="80" width="160" height="20" rx="4" fill="#21262d"/>
    <text x="30" y="94" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Pagination &amp; Rate Limits</text>
    <rect x="20" y="105" width="160" height="20" rx="4" fill="#21262d"/>
    <text x="30" y="119" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">CSV Normalization</text>
  </g>

  <!-- Artifacts -->
  <g id="artifacts" transform="translate(490, 80)">
    <path d="M -60 130 L -10 130" stroke="#30363d" stroke-width="2" fill="none"/>
    <path d="M -10 130 L -10 60 L 20 60" stroke="#30363d" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M -10 130 L -10 200 L 20 200" stroke="#30363d" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <circle cx="20" cy="60" r="4" fill="#8b949e"/>
    <circle cx="20" cy="200" r="4" fill="#8b949e"/>

    <!-- State file -->
    <rect x="30" y="30" width="140" height="60" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="55" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" text-anchor="middle">.state/</text>
    <text x="100" y="73" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Timestamp tracking</text>

    <!-- CSV Input -->
    <rect x="30" y="170" width="140" height="60" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="195" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" text-anchor="middle">input/*.csv</text>
    <text x="100" y="213" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Clean data dump</text>

    <!-- Output Arrow -->
    <path d="M 170 200 L 220 200" stroke="#a371f7" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <circle cx="220" cy="200" r="4" fill="#a371f7"/>
  </g>

  <!-- Orchestrator -->
  <g id="orchestrator" transform="translate(720, 130)">
    <rect x="0" y="0" width="180" height="140" rx="12" fill="#161b22" stroke="url(#runGrad)" stroke-width="2"/>
    <text x="90" y="35" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">run-all.sh</text>
    <text x="90" y="55" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" text-anchor="middle">Universal Orchestrator</text>

    <!-- Sub tasks -->
    <rect x="20" y="70" width="140" height="20" rx="4" fill="#21262d"/>
    <text x="30" y="84" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Platform Routing</text>
    <rect x="20" y="95" width="140" height="20" rx="4" fill="#21262d"/>
    <text x="30" y="109" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Cross-Validation</text>
  </g>

  <!-- Destinations -->
  <g id="destinations" transform="translate(900, 80)">
    <path d="M 0 120 L 30 120" stroke="#a371f7" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
    <path d="M 30 120 L 30 50 L 60 50" stroke="#a371f7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="4 4"/>
    <path d="M 30 120 L 30 190 L 60 190" stroke="#a371f7" stroke-width="2" fill="none" stroke-linejoin="round" stroke-dasharray="4 4"/>
    <circle cx="60" cy="50" r="4" fill="#e3b341"/>
    <circle cx="60" cy="190" r="4" fill="#a371f7"/>

    <!-- Ghostfolio Container -->
    <rect x="70" y="10" width="180" height="80" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="80" y="25" width="30" height="30" rx="6" fill="#e3b341" opacity="0.2"/>
    <text x="120" y="45" fill="#e3b341" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Ghostfolio</text>
    <text x="120" y="65" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">export-to-ghostfolio</text>

    <!-- Investbrain Module -->
    <rect x="70" y="150" width="180" height="80" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1"/>
    <rect x="80" y="165" width="30" height="30" rx="6" fill="#a371f7" opacity="0.2"/>
    <text x="120" y="185" fill="#a371f7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Investbrain</text>
    <text x="120" y="205" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">investbrain_import.py</text>
  </g>

</svg>
